name: MM Google Trends Collector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collectors/google_trends_collector.py'
      - 'requirements-trends.txt'
      - '.github/workflows/google-trends.yml'
  schedule:
    - cron: '25 10 * * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-trends.txt
      - run: pip install -r requirements-trends.txt
      - name: Collect Google Trends intelligence
        env:
          SUPABASE_URL: https://tazyeczbbgspqbyluynf.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_olCaCIksSYJGOaAYInXHeA_2pm-gaoF
        run: python collectors/google_trends_collector.py
