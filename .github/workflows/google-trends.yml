name: MM Google Trends Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '25 10 * * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-trends.txt
      - run: pip install -r requirements-trends.txt
      - name: Collect Google Trends intelligence
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python collectors/google_trends_collector.py
